<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Multiplayer Game</title>
</head>
<body style="background: #111; color: white; text-align: center; font-family: sans-serif; padding-top: 50px;">
    <h1>My Free Multiplayer Game Website</h1>
    <p>Server Status: <span id="status" style="color: orange;">Connecting...</span></p>

    <script>
        const socket = new WebSocket('wss://faster-conjoined-angling.ngrok-free.dev');
        const statusText = document.getElementById('status');

        socket.onopen = () => {
            statusText.innerText = "Connected to Server Live on PC!";
            statusText.style.color = "lightgreen";
            console.log("Multiplayer channel opened successfully.");
        };

        socket.onmessage = (event) => {
            console.log("Data received from server:", event.data);
        };

        socket.onclose = () => {
            statusText.innerText = "Offline (PC server is turned off)";
            statusText.style.color = "red";
        };
    </script>
</body>
</html>
